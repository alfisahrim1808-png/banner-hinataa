<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Promosi MAFIATOTO - Hinata Live</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f1020;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .banner-container {
            position: relative;
            width: 900px;
            height: 500px;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
            overflow: hidden;
            background-color: #16182e;
            cursor: pointer;
            animation: borderGlow 3s infinite alternate;
        }

        @keyframes borderGlow {
            0% {
                border-color: #ffcc00;
                box-shadow: 0 0 15px rgba(255, 204, 0, 0.4), inset 0 0 15px rgba(255, 204, 0, 0.2);
            }
            100% {
                border-color: #00ffff;
                box-shadow: 0 0 35px rgba(0, 255, 255, 0.8), inset 0 0 25px rgba(0, 255, 255, 0.4);
            }
        }

        /* Gambar Hinata bernapas hidup */
        .banner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            animation: liveBreathing 4s ease-in-out infinite;
        }

        @keyframes liveBreathing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Kanvas Partikel */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Area Teks Berjalan dan Watermark */
        .bottom-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-top: 2px solid #ffcc00;
            padding: 8px 0;
            z-index: 3;
        }

        /* Teks Berjalan */
        .marquee-box {
            overflow: hidden;
            width: 100%;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 12s linear infinite;
            color: #ffcc00;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
            margin-bottom: 5px; /* Jarak antara teks berjalan dan watermark */
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Watermark KENMAFIA (di bawah teks berjalan) */
        .watermark {
            color: rgba(255, 255, 255, 0.7); /* Warna putih agak transparan */
            font-size: 12px; /* Ukuran font 12px */
            font-weight: normal;
            text-transform: uppercase; /* Memastikan huruf KAPITAL SEMUA */
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
            display: block;
            margin-top: -2px;
        }
    </style>
</head>
<body>

    <!-- Seluruh area banner dibungkus fungsi klik -->
    <div class="banner-container" onclick="bukaLinkAlternatif()">
        <!-- Gambar Hinata Lokal -->
        <img class="banner-bg" src="hinata.jpg" alt="Hinata Banner" onerror="this.src='hinata.jpeg'">
        
        <!-- Kanvas Animasi Cahaya -->
        <canvas id="particleCanvas"></canvas>
        
        <!-- Area Bawah (Overlay) -->
        <div class="bottom-overlay">
            <!-- Teks Berjalan -->
            <div class="marquee-box">
                <div class="marquee-text">
                    🔥 MAFIATOTO SITUS GACOR • MAXWIN SETIAP HARI • KLIK BANNER INI UNTUK DAFTAR & RAIH KEMENANGANMU! 🔥
                </div>
            </div>
            <!-- Watermark KENMAFIA -->
            <span class="watermark">kenmafia</span>
        </div>
    </div>

    <script>
        // Fungsi untuk mengarahkan ke link alternatif di tab baru saat banner diklik
        function bukaLinkAlternatif() {
            window.open("https://ln.run/HFWyc", "_blank");
        }

        const canvas = document.getElementById("particleCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
        }
        resizeCanvas();

        let particles = [];
        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.5 + 1,
                speedX: (Math.random() - 0.5) * 0.8,
                speedY: (Math.random() - 0.5) * 0.8,
                color: Math.random() > 0.4 ? '#ffcc00' : '#00ffff'
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fill();

                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

</body>
</html>
